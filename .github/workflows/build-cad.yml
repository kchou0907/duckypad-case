name: Build CAD exports

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/build-cad.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CadQuery
        run: python -m pip install --upgrade pip cadquery

      - name: Generate CAD exports
        run: python src/duckypad_ikki_powerbank_case.py

      - name: Copy generated printable files
        run: |
          mkdir -p stl cad
          cp src/duckypad_case_exports/*.stl stl/
          cp src/duckypad_case_exports/active_mounts.txt cad/active_mounts.txt

      - name: Commit generated STL files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stl/ cad/active_mounts.txt
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git commit -m "Update generated STL exports"
          git push
